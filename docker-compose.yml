version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: namma_seva_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-namma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-namma_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-namma_seva}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-namma_user} -d $${POSTGRES_DB:-namma_seva}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    container_name: namma_seva_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-namma_user}:${POSTGRES_PASSWORD:-namma_secure_password_2026}@postgres:5432/${POSTGRES_DB:-namma_seva}
      - SECRET_KEY=${SECRET_KEY}
      - DOC_ENCRYPTION_KEY=${DOC_ENCRYPTION_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY}
      - DELETION_PEPPER=${DELETION_PEPPER}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - DEMO_MODE=${DEMO_MODE:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: namma_seva_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  app_storage:
  postgres_data:

