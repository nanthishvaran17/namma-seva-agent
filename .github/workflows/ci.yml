name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: namma_user
          POSTGRES_PASSWORD: namma_secure_password_2026
          POSTGRES_DB: namma_seva_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Full Alembic Schema Migration on PostgreSQL Container
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://namma_user:namma_secure_password_2026@localhost:5432/namma_seva_ci
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic check

      - name: Run Pytest Test Suite & 50-Case Benchmark (SQLite + Postgres)
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
        run: |
          pytest backend/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build
