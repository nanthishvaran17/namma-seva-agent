[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "namma-seva-backend"
version = "1.0.0"
description = "Tamil Nadu's Unified AI Agent for Government Services — Backend Engine"
authors = [
    { name = "Namma Seva Engineering Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "reportlab>=4.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]
